name: debug-cdx
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: probe via Cloudflare Worker proxy
        run: |
          set +e
          PROXY_BASE="https://cdx-proxy.1290848232a.workers.dev"
          DIRECT_URL="https://web.archive.org/cdx/search/cdx?url=twitter.com/0502railgun1949/status/&matchType=prefix&output=json&filter=mimetype:application/json&limit=5"
          PROXY_URL="${PROXY_BASE}/web.archive.org/cdx/search/cdx?url=twitter.com/0502railgun1949/status/&matchType=prefix&output=json&filter=mimetype:application/json&limit=5"

          {
            echo "=== runner outbound IP ==="
            curl -s https://ifconfig.me
            echo ""

            echo ""
            echo "########## 对照：直连 archive.org（预期 498） ##########"
            curl -s -o /tmp/direct_body.txt -w "HTTP_CODE:%{http_code}\n" "$DIRECT_URL"
            echo "--- direct body (first 500 bytes) ---"
            head -c 500 /tmp/direct_body.txt
            echo ""

            echo ""
            echo "########## 测试：走 Cloudflare Worker 代理 ##########"
            curl -s -o /tmp/proxy_body.txt -w "HTTP_CODE:%{http_code}\n" "$PROXY_URL"
            echo "--- proxy body (first 1000 bytes) ---"
            head -c 1000 /tmp/proxy_body.txt
            echo ""

            echo ""
            echo "########## 测试：走代理 -v 详细信息 ##########"
            curl -sv -o /dev/null "$PROXY_URL" 2>&1 | grep -E "^[<>]|HTTP/"

          } > _debug_cdx.txt
          cat _debug_cdx.txt

      - name: commit debug output
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@example.com"
          git add _debug_cdx.txt || true
          git commit -m "debug: cdx via cloudflare worker proxy" || echo "nothing to commit"
          git push
