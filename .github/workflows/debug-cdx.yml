name: debug-cdx
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: AB test limit param same IP
        run: |
          set +e
          python3 - > _debug_cdx_result.txt 2>&1 << 'PYEOF'
          import requests, time

          CDX_BASE_URL = "https://web.archive.org/cdx/search/cdx"
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              ),
              "Referer": "https://web.archive.org/",
          }
          base_params = {
              "url": "twitter.com/0502railgun1949/status/",
              "matchType": "prefix",
              "output": "json",
              "filter": "mimetype:application/json",
          }

          def probe(name, params):
              sess = requests.Session()
              sess.headers.update(HEADERS)
              try:
                  resp = sess.get(CDX_BASE_URL, params=params, timeout=60)
                  print('[' + name + '] status_code:', resp.status_code)
                  resp.raise_for_status()
                  rows = resp.json()
                  n = len(rows) - 1 if isinstance(rows, list) else 'N/A'
                  print('[' + name + '] SUCCESS, rows:', n)
              except Exception as e:
                  print('[' + name + '] FAILED:', type(e).__name__, e)

          print('=== A: no limit (original script params) ===')
          probe('A-no-limit', dict(base_params))
          time.sleep(2)
          print('')
          print('=== B: limit=5 ===')
          p2 = dict(base_params); p2['limit'] = '5'
          probe('B-limit-5', p2)
          time.sleep(2)
          print('')
          print('=== C: limit=100 ===')
          p3 = dict(base_params); p3['limit'] = '100'
          probe('C-limit-100', p3)
          time.sleep(2)
          print('')
          print('=== D: no limit retry (confirm not one-off) ===')
          probe('D-no-limit-retry', dict(base_params))
          time.sleep(2)
          print('')
          print('=== E: no filter, limit=5 ===')
          p5 = {'url': base_params['url'], 'matchType': 'prefix', 'output': 'json', 'limit': '5'}
          probe('E-nofilter-limit5', p5)
          PYEOF
          echo '=== runner IP ===' >> _debug_cdx_result.txt
          curl -s https://ifconfig.me >> _debug_cdx_result.txt
          echo '' >> _debug_cdx_result.txt
          cat _debug_cdx_result.txt

      - name: append to history log
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "===== A/B RUN AT $TS =====" >> _debug_ab_history.txt
          cat _debug_cdx_result.txt >> _debug_ab_history.txt
          echo "" >> _debug_ab_history.txt

      - name: commit debug output
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@example.com"
          git add _debug_ab_history.txt || true
          git commit -m "debug: A/B limit param test" || echo "nothing to commit"
          git push
