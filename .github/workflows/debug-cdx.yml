name: debug-cdx
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: exact replica of cmd_fetch_cdx request
        run: |
          set +e
          python3 - > _debug_cdx_result.txt 2>&1 << 'PYEOF'
          import requests

          CDX_BASE_URL = "https://web.archive.org/cdx/search/cdx"
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              ),
              "Referer": "https://web.archive.org/",
          }
          params = {
              "url": "twitter.com/0502railgun1949/status/",
              "matchType": "prefix",
              "output": "json",
              "filter": "mimetype:application/json",
          }

          sess = requests.Session()
          sess.headers.update(HEADERS)

          try:
              resp = sess.get(CDX_BASE_URL, params=params, timeout=60)
              print("status_code:", resp.status_code)
              resp.raise_for_status()
              rows = resp.json()
              print("SUCCESS, snapshot rows:", len(rows) - 1 if isinstance(rows, list) else "N/A")
          except Exception as e:
              print("FAILED:", type(e).__name__, e)
          PYEOF
          echo "=== runner IP ===" >> _debug_cdx_result.txt
          curl -s https://ifconfig.me >> _debug_cdx_result.txt
          echo "" >> _debug_cdx_result.txt
          cat _debug_cdx_result.txt

      - name: append to history log
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "===== RUN AT $TS =====" >> _debug_cdx_history.txt
          cat _debug_cdx_result.txt >> _debug_cdx_history.txt
          echo "" >> _debug_cdx_history.txt

      - name: commit debug output
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@example.com"
          git add _debug_cdx_history.txt || true
          git commit -m "debug: exact cmd_fetch_cdx replica probe" || echo "nothing to commit"
          git push
