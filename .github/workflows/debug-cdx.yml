name: debug-cdx
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: probe CDX API (raw headers + body)
        run: |
          set +e
          URL="https://web.archive.org/cdx/search/cdx?url=twitter.com%2F0502railgun1949%2Fstatus%2F&matchType=prefix&output=json&filter=mimetype%3Aapplication%2Fjson&limit=5"
          {
            echo "=== runner outbound IP ==="
            curl -s https://ifconfig.me
            echo ""
            echo "=== curl -v (full request/response trace) ==="
            curl -v -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -H "Referer: https://web.archive.org/" \
              "$URL" -o _debug_cdx_body.txt 2>&1
            echo ""
            echo "=== body (first 2000 bytes) ==="
            head -c 2000 _debug_cdx_body.txt
            echo ""
            echo "=== retry after 5s, second attempt (check if transient) ==="
            sleep 5
            curl -sv -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -H "Referer: https://web.archive.org/" \
              "$URL" -o _debug_cdx_body2.txt 2>&1
          } > _debug_cdx.txt

      - name: commit debug output
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@example.com"
          git add _debug_cdx.txt _debug_cdx_body.txt _debug_cdx_body2.txt || true
          git commit -m "debug: cdx probe output" || echo "nothing to commit"
          git push || echo "push failed"
